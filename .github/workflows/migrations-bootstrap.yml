name: Versionar migraciones (una sola vez)

# Genera y sube al repo la historia de migraciones cuando aún no existe:
#   0000_init       = esquema que ya está desplegado en producción (commit 4294b02)
#   0001_*          = cambios incrementales hacia el esquema actual
# La fecha de 0000 se fija en el pasado para que producción lo considere ya aplicado.
on:
  push:
    branches: ['feat/**']
    paths: ['apps/api/src/db/schema.ts', '.github/workflows/migrations-bootstrap.yml']

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ¿Ya hay migraciones versionadas?
        id: check
        run: if [ -d apps/api/drizzle ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
      - name: Instalar (genera package-lock.json)
        if: steps.check.outputs.skip != 'true'
        run: npm install --no-audit --no-fund
      - name: Generar 0000 (esquema desplegado) y 0001 (cambios)
        if: steps.check.outputs.skip != 'true'
        run: |
          cp apps/api/src/db/schema.ts "$RUNNER_TEMP/schema.new.ts"
          git show 4294b02:apps/api/src/db/schema.ts > apps/api/src/db/schema.ts
          (cd apps/api && npx drizzle-kit generate --name init)
          J=apps/api/drizzle/meta/_journal.json
          jq '.entries[0].when = 1700000000000' "$J" > "$J.tmp" && mv "$J.tmp" "$J"
          cp "$RUNNER_TEMP/schema.new.ts" apps/api/src/db/schema.ts
          (cd apps/api && npx drizzle-kit generate --name portal_plataforma)
          ls -la apps/api/drizzle
          echo "----- 0001 -----"; cat apps/api/drizzle/0001_*.sql
      - name: Subir al repositorio
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/drizzle package-lock.json
          git commit -m "chore: migraciones versionadas y package-lock"
          git push
