# Producción en un servidor Linux propio (EC2, Hostinger VPS, etc.). Guía: docs/DESPLIEGUE_VPS.md
#   cd deploy && sh generar-env.sh && docker compose up -d --build
name: aror

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  db:
    <<: *common
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en deploy/.env}
      POSTGRES_DB: residencial
      TZ: ${TZ:-America/El_Salvador}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d residencial"]
      interval: 5s
      retries: 20
    # Sin puertos publicados: solo la API llega a la base

  api:
    <<: *common
    build: { context: .., dockerfile: apps/api/Dockerfile }
    image: aror-api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@db:5432/residencial
      DATABASE_SSL: "false"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Falta JWT_ACCESS_SECRET en deploy/.env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Falta JWT_REFRESH_SECRET en deploy/.env}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-ricardo}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?Falta SUPERADMIN_PASSWORD en deploy/.env}
      # Web y API comparten dominio (Caddy): sin CORS
      CORS_ORIGINS: ""
      # navegador → Caddy → API
      TRUST_PROXY: "1"
      RUN_MIGRATIONS: "true"
      SERVICE_HOURS: ${SERVICE_HOURS:-}
      SERVICE_TIMEZONE: ${TZ:-America/El_Salvador}
    depends_on:
      db: { condition: service_healthy }

  web:
    <<: *common
    build: { context: .., dockerfile: apps/web/Dockerfile }
    image: aror-web
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data # certificados HTTPS
      - caddy_config:/config
    depends_on: [api]

  # Respaldo diario en deploy/backups (se conservan BACKUP_KEEP_DAYS días). Cópialos fuera del servidor (ver la guía).
  backup:
    <<: *common
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-America/El_Salvador}
    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  caddy_data:
  caddy_config:
